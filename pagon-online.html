<script>
const $=i=>document.getElementById(i),SU=['♠','♣','♥','♦'],RL=r=>r<11?r:'JQKA'[r-11],cs=c=>RL(c.r)+SU[c.s];
const N=['Сиз','Чап рақиб','Шерик','Ўнг рақиб'],sy=(p,w)=>`\u0001${p}\u0002${w}\u0003`,rs=t=>t.replace(/\u0001(\d)\u0002([^\u0003]*)\u0003/g,(m,p,w)=>+p?(NM[p]||N[p])+' '+w+'ди':'Сиз '+w+'дингиз');
let seed=+new URLSearchParams(location.search).get('seed')||Date.now(),HU=0,CH=0,VI=0,TST=0,S,M={pg:[6,6]},TM,AP=0,LG=[],LO=0,LP=0,XP={},LN=0,PZ=0,SP=1,SPD=[2,1,.1],TS0=Date.now();
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},pk=a=>a[rnd()*a.length|0];
const dl=()=>(1500+rnd()*1000)*SPD[SP]; // botlar kutish vaqti: 1,5–2,5 soniya
// K: 0 oddiy, 1 oʻz pagon (P), 2 raqib pagon (R)
const K=(c,x)=>S.pg[0]==S.pg[1]?0:c.r==S.pg[x%2]?1:c.r==S.pg[1-x%2]?2:0;
const ok=(c,x,df)=>{const k=K(c,x),t=c.s==S.t;return!(k==1&&!t||df&&k==2&&!t)};
const beats=(a,c,d)=>!(K(a,d)==1&&a.s!=S.t)&&ok(c,d,1)&&(c.s==a.s?c.r>a.r:c.s==S.t);
const addok=(c,x)=>S.tab.length<S.lim&&ok(c,x,0)&&S.tab.some(p=>p.a.r==c.r||p.d&&p.d.r==c.r);
const val=(c,x)=>c.r+(c.s==S.t?20:0)+(K(c,x)==1?30:0);
const low=(a,x)=>a.reduce((m,c)=>!m||val(c,x)<val(m,x)?c:m,null);
const rm=(p,c)=>S.hands[p].splice(S.hands[p].indexOf(c),1);
const nx=s=>{for(let i=0;i<4;i++)if(S.hands[(s+i)%4].length)return(s+i)%4;return s};
const allc=()=>S.tab.flatMap(p=>p.d?[p.a,p.d]:[p.a]);
// hujumni sherikka berish: faqat oʻyinning birinchi hujumida (S.cnt==0) yoki hujum qila olmaganda (faqat kozirsiz pagon)
const canPass=x=>S.bito[x]<3&&S.hands[(x+2)%4].length>0&&(S.cnt==0||!S.hands[x].some(c=>ok(c,x,0)));

function newGame(prev){
 const d=[];for(let s=0;s<4;s++)for(let r=6;r<15;r++)d.push({s,r});
 for(let i=35;i>0;i--){const j=rnd()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 S={pg:[...M.pg],deck:d,hands:[[],[],[],[]],ground:[],dis:[],tab:[],bito:[0,0,0,0],cnt:0,t:d[0].s,a:0,d:1,x:0,lim:6,ev:'',wn:'',sel:-1,over:0};
 for(let k=0;k<6;k++)for(let p=0;p<4;p++)S.hands[p].push(d.pop());
 al()&&AQ.push({t:'deal'});
 const f=first(prev),e=S.pg[0]==S.pg[1];lg('Янги ўйин',[1,2,3,4],'36 карта, ҳар кимга 6 тадан. Козир: '+SU[S.t]+'. Пагонлар: Биз '+S.pg[0]+', Улар '+S.pg[1]+(e?' — Дурак (пагон таъсир қилмайди)':'')+'. Биринчи ҳужумчи: '+N[f]+(S.hands[f].some(c=>c.s==S.t)?' (энг кичик козир эгаси).':' (козир йўқ — ғолиб жамоанинг биринчи ўйинчиси).'));round(f)}
// boshlovchi: eng past kozir egasi (prev: oldingi gʻolib jamoa, -1: hamma)
function first(prev){
 let b=-1,v=99;
 for(const p of prev<0?[0,1,2,3]:[prev,prev+2])for(const c of S.hands[p])if(c.s==S.t&&c.r<v){v=c.r;b=p}
 return b<0?(prev<0?0:prev):b}

function chk(){
 if(S.over)return 1;
 const dn=t=>!S.hands[t].length&&!S.hands[t+2].length;let r=-2;
 if(!S.deck.length){const a=dn(0),b=dn(1);r=a&&b?-1:a?0:b?1:-2}
 if(r==-2&&S.cnt>=60)r=-1;
 if(r>-2){fin(r);return 1}return 0}

function fin(r){
 S.over=1;S.res=r;S.champ=-1;S.gp=0;if(r<0){PS(r);lg('Дуранг',[18,19],(S.deck.length?'Раундлар сони 60 дан ошди':'Икки жамоа бир вақтда тугатди')+'. Пагонлар ўзгармайди, ўйин қайта ўйналади.');return}
 const o=S.pg[r],eq=S.pg[0]==S.pg[1];S.old=o;
 S.gp=eq?0:S.ground.filter(c=>c.r==o).length;
 M.pg[r]=o+(eq?1:[0,1,1,1,2][Math.min(4,S.gp)]);
 if(M.pg[r]>14)S.champ=r;PS(r);lg((r?'Рақиблар':'Сиз')+' ютди',S.champ>=0?[18,20,21]:[18,20],'Ғолиб жамоа тугатди. '+(eq?'Дурак ўйини: пагон +1.':'Ерда '+S.gp+' та '+o+'-пагон картаси → пагон +'+(M.pg[r]-o)+'.')+' Пагон: '+o+' → '+Math.min(14,M.pg[r])+(S.champ>=0?'. Пагон 14 дан ошди — матч чемпиони.':''))}

function round(a){
 if(chk())return;
 a=nx(a);const d=[(a+1)%4,(a+3)%4].find(p=>S.hands[p].length);
 if(d==null)return fin(-1);
 S.a=S.x=a;S.d=d;S.tab=[];S.sel=-1;S.lim=Math.min(6,S.hands[d].length);
 const r=drop(a);if(chk())return;if(r)round((a+2)%4)}

// koloda tugagan, hujum navbati sizda, qoʻlda faqat pagon: avtomatik yerga
function drop(a){
 const h=S.hands[a],p=(a+2)%4,g=S.pg[a%2];
 if(S.pg[0]==S.pg[1]||S.deck.length||!h.length||!h.every(c=>c.r==g))return 0;

 if(!q.length||q.every(c=>c.r==g)){S.ground.push(...h,...q);S.hands[a]=[];S.hands[p]=[];S.ev=q.length?'Жамоа тугатди!':'Пагонлар ерга тушди';lg(S.ev,[17],'Колода тугаган; '+N[a]+' қўлида фақат ўз пагонлари; шерик '+(q.length?'қўлида ҳам фақат пагон':'қўлида карта йўқ')+' → '+(h.length+q.length)+' та карта ерга тушди.');return 0}
 q.push(...h);S.hands[a]=[];S.ev='Пагонлар шерикка ўтди';lg(S.ev,[17],'Колода тугаган; '+N[a]+' қўлида фақат ўз пагонлари, шерикда бошқа карталар бор → '+h.length+' та пагон '+N[p]+' қўлига ўтди.');return 1}

function play(x,c,w){if(!ok(c,x,0))VI++;AN('p',x,c);rm(x,c);S.tab.push({a:c,d:null});S.ev=sy(x,w)+': '+cs(c);const L=S.tab.length==1;lg(S.ev,L?[5,6]:[6,7],cs(c)+' — '+kt(c,x)+'. '+(L?'Ҳужумчи: '+N[x]+', ҳимоячи: '+N[S.d]+'.':'Рақам столдагига мос; ҳужум карталари '+S.tab.length+'/'+S.lim+'.'))}
function defend(d,c,i){if(!beats(S.tab[i].a,c,d))VI++;AN('d',d,c);S.tab[i].d=c;rm(d,c);S.sel=-1;S.ev=sy(d,'бос')+': '+cs(S.tab[i].a)+' → '+cs(c);const a=S.tab[i].a,r=[8];if(K(c,d))r.push(9);if(K(a,d)==1)r.push(10);lg(S.ev,r,N[d]+': '+cs(a)+' ('+kt(a,d)+') → '+cs(c)+' ('+kt(c,d)+'). '+(a.s==c.s?'Бир хил масть, катта карта.':'Козир билан босилди.'))}

// t=1: himoyachi hammasini oladi; t=0: Bito (faqat hamma karta bosilgan boʻlsa)
function endRound(t){
 AS(t);const a=S.a,d=S.d,c=allc();
 if(!t&&S.tab.some(p=>!p.d))VI++;
 if(t){S.hands[d].push(...c);S.ev=sy(d,'ол')}else{S.dis.push(...c);S.ev='Бито — стол ёпилди'}
 S.tab=[];S.cnt++;
 for(const p of[a,(a+2)%4,(a+3)%4,d])while(S.deck.length&&S.hands[p].length<6)S.hands[p].push(S.deck.pop());
 const f=nx(t?(d+1)%4:d);lg(S.ev,t?[12,13,14]:[11,13,14],'Стол: '+c.length+' та карта. '+(t?N[d]+' ҳаммасини олди.':'Ҳамма ҳужум карталари босилган — карталар ўйиндан чиқди.')+' Колодадан тўлдирилди (қолди: '+S.deck.length+'). Кейинги ҳужумчи: '+N[f]+'.');round(t?(d+1)%4:d)}

function bl(x,can){const r=can.filter(c=>K(c,x)==2&&c.s!=S.t),n=can.filter(c=>c.s!=S.t);return CH?pk(can):low(r.length?r:n.length?n:can,x)}
function ba(p,cs){const n=cs.filter(c=>c.s!=S.t),r=n.filter(c=>K(c,p)==2);return low(r.length?r:n.length?n:S.hands[p].length<3?cs:[],p)}
// himoyachi bot: HAMMA bosilmagan kartani bosish rejasi; iloji boʻlmasa null (olaman). Qaytaradi [stol indeksi, karta]
function plan(d){
 const u=[],key=i=>S.tab[i].a.r+(S.tab[i].a.s==S.t?20:0),used=[];let first=null;
 S.tab.forEach((p,i)=>{if(!p.d)u.push(i)});
 u.sort((i,j)=>key(j)-key(i));
 for(const i of u){
  const c=low(S.hands[d].filter(c=>!used.includes(c)&&beats(S.tab[i].a,c,d)),d);
  if(!c)return null;used.push(c);if(!first)first=[i,c]}

// bitta bot qadami: 0 = hech narsa qilmadi (oʻyinchi harakati kutilmoqda)
function tick(){
 if(S.over)return 0;
 const hu=x=>HU>=0&&HS[x]&&!AP;
 if(!S.tab.length){ // hujum boshi
  const x=S.x,can=S.hands[x].filter(c=>ok(c,x,0));
  if(!can.length){if(canPass(x)){if(hu(x))return 0;pass(x)}else xf(x);return 1}
  if(hu(x))return 0;
  play(x,bl(x,can),'ҳужум қил');return 1}
 const d=S.d,at=[S.a,(S.a+2)%4].filter(p=>S.hands[p].length),un=S.tab.filter(p=>!p.d);
 if(S.tab.length<S.lim&&S.hands[d].length){ // hujumchi botlar yana karta qoʻshadi
  for(const p of at){
   if(hu(p))continue;
   const cs=S.hands[p].filter(c=>addok(c,p));if(!cs.length)continue;
   const c=CH?(rnd()<.5?pk(cs):0):rnd()<(un.length?.35:.6)?ba(p,cs):0;
   if(c){play(p,c,'қўш');return 1}}}

  if(hu(d))return 0; // himoyachi — siz: Olaman yoki bosishni oʻzingiz hal qilasiz
  const pl=plan(d);
  if(!pl||CH&&rnd()<.2){endRound(1);return 1}
  defend(d,pl[1],pl[0]);return 1}
 if(at.some(hu))return 0; // hujumchi — siz: Bito yoki qoʻshishni oʻzingiz hal qilasiz
 endRound(0);return 1}

function fly(h,b,kf,o){

 document.body.appendChild(n);

 h.sort((a,b)=>ky(a)-ky(b));

 else if(m=='def')pr=!un.length?'Ҳаммаси босилди. Кутинг…':h.some(c=>un.some(p=>beats(p.a,c,0)))?'Босилмаган: '+un.length+' та. Карта билан босинг ёки Оламан босинг':'Босиб бўлмайди — Оламан босинг';

['M-2',()=>F({pg:[13,6],g:rk(13,1)},0)=='14,6'&&S.champ==-1],
['M-3',()=>{F({pg:[14,6],g:rk(14,2)},0);return S.champ==0}],
['M-4',()=>F({pg:[14,6]},0)=='14,6'&&S.champ==-1],
['M-5',()=>{F({pg:[14,14]},0);return S.champ==0}],
['M-6',()=>F({pg:[12,6],g:rk(12,4)},0)=='14,6'&&S.champ==-1],
['D-1',()=>{mk({pg:[7,6]});fin(-1);const a=M.pg+'';nextG();return a=='7,6'&&S.pg+''=='7,6'&&!S.over}],
['D-2',()=>{mk({cnt:60,dk:3});chk();return S.res==-1}],

['D-4',()=>{mk({cnt:5,tab:[['♠9','♥10']]});endRound(0);const a=S.cnt;mk({cnt:5,tab:[['♠9']]});endRound(1);return a==6&&S.cnt==6}],
['D-5',()=>{mk({pg:[7,6]});fin(-1);nextG();return S.pg[0]!=S.pg[1]}],
['D-6',()=>{mk({pg:[7,6]});fin(-1);nextG();const b=lt();return b<0||b==S.a}],
['X-1',()=>XR.err==0&&XR.g>0],
['X-2',()=>XR.stall==0],

['X-4',()=>XR.vi==0],
['X-5',()=>{const f=()=>{seed=777;M={pg:[6,6]};HU=-1;CH=1;newGame(-1);let k=0;while(tick()&&k++<9999);return JSON.stringify([S.res,S.cnt,S.ground,S.dis,S.hands])};return f()==f()}],
['X-6',()=>XR.champ==0]];
function T(){
 const sv=[S,M,HU,CH,seed,VI,AP],m=Object.fromEntries(TS),bad=[];TST=1;AP=0;seed=12345;XR=sim(50);
 for(const[id,f]of TS)try{mk();if(!(typeof f=='string'?m[f.slice(1)]:f)())bad.push(id)}catch(e){bad.push(id+'!')}
 ;[S,M,HU,CH,seed,VI,AP]=sv;TST=0;
 $('tr').textContent=bad.length?`Синов: ${TS.length} та ҳолатдан ${bad.length} таси ўтмади: ${bad.join(' ')}`:`Синов: ${TS.length} та ҳолатнинг ҳаммаси ўтди ✓ (${XR.g} та тасодифий ўйин)`}

// ===== Онлайн: хона коди, ҳар ким ўз жойида, бўш жойларда ботлар =====
let MP=null,CL=0,HS=[1,0,0,0],NM=['','','',''],WN=['','','',''],PT=0;
const E4=()=>['','','',''],ck=c=>c?c.s+'_'+c.r:'',cl=t=>String(t||'').replace(/[<>&]/g,'').slice(0,14);
// ҳолатни ўйинчи нуқтаи назарига айлантириш: k-жой 0-жой бўлади
const RT=(s,k)=>{s=JSON.parse(JSON.stringify(s));if(!k)return s;const r=a=>a.map((_,i)=>a[(i+k)%4]);s.hands=r(s.hands);s.bito=r(s.bito);for(const f of['a','d','x'])s[f]=(s[f]-k+4)%4;if(k%2){s.pg.reverse();if(s.res>=0)s.res=1-s.res;if(s.champ>=0)s.champ=1-s.champ}s.ev=(s.ev||'').replace(/\u0001(\d)/g,(m,p)=>'\u0001'+((p-k+4)%4));return s};
const RM=(m,k)=>({pg:k%2?[m.pg[1],m.pg[0]]:[...m.pg]});
const MS=t=>{const e=$('mm');if(e){e.textContent=t;e.style.display=''}};
const MW=o=>{$('mw').className=o?'on':'';if(o)MR()};
/*FB-START*/
// ===== Firebase Realtime Database (REST + EventSource): ўз серверингиз керак эмас, фақат база манзили =====
const FB0='https://pagon-21478-default-rtdb.europe-west1.firebasedatabase.app';
try{const h=new URLSearchParams(location.hash.slice(1)).get('fb');if(h)localStorage.setItem('pagon_fb',h)}catch(e){}
const FBG=()=>{try{return(localStorage.getItem('pagon_fb')||FB0).replace(/\/+$/,'')}catch(e){return FB0}};
const FU=p=>FBG()+'/'+p+'.json';
const mg=(o,v)=>{for(const k in v){if(v[k]===null)delete o[k];else o[k]=v[k]}return o};
function fstream(p,cb,er){let d=null;const es=new EventSource(FU(p));
 const h=m=>e=>{try{const j=JSON.parse(e.data),k=j.path.split('/').filter(Boolean);
  if(!k.length)d=m&&d&&typeof d=='object'&&j.data?mg(d,j.data):j.data;
  else{if(!d||typeof d!='object')d={};let o=d;for(let i=0;i<k.length-1;i++){if(!o[k[i]]||typeof o[k[i]]!='object')o[k[i]]={};o=o[k[i]]}
   const l=k[k.length-1];if(j.data===null)delete o[l];else if(m&&j.data&&typeof j.data=='object')o[l]=mg(o[l]&&typeof o[l]=='object'?o[l]:{},j.data);else o[l]=j.data}
  cb(d)}catch(x){}};
 es.addEventListener('put',h(0));es.addEventListener('patch',h(1));es.onerror=()=>{if(es.readyState==2&&er)er()};return()=>es.close()}
const fr=(m,p,d)=>fetch(FU(p),{method:m,body:JSON.stringify(d)}).then(r=>{if(!r.ok)throw new Error(r.status)});
const FDB={
 doc:p=>({get:()=>fetch(FU(p)).then(r=>r.json()).then(d=>({exists:d!=null,data:()=>d||undefined})),set:d=>fr('PUT',p,d),update:d=>fr('PATCH',p,d),
  onSnapshot:(f,e)=>fstream(p,d=>f({exists:d!=null,data:()=>d||undefined}),e)}),
 collection:p=>({onSnapshot:(f,e)=>fstream(p,d=>f({docs:Object.keys(d||{}).map(id=>({id,data:()=>d[id]}))}),e)})};
/*FB-END*/
async function MI(){if(!/^https:\/\/./.test(FBG()))return'Аввал база манзилини киритинг';let id;try{id=localStorage.getItem('pagon_uid');if(!id)localStorage.setItem('pagon_uid',id=Math.random().toString(36).slice(2,10)+Date.now().toString(36))}catch(e){id=Math.random().toString(36).slice(2,10)}return{db:FDB,id}}
function FUI(){return FBG()?'<button onclick="FC()">🔗 Ҳаволани нусхалаш (дўстлар учун)</button><button onclick="FX()">База манзилини ўзгартириш</button>':'<label class="pg">Firebase Realtime Database манзили<input id="fi" placeholder="https://…firebaseio.com"></label><button onclick="FS()">Сақлаш</button>'}
function FS(){const v=($('fi').value||'').trim().replace(/\/+$/,'');if(!/^https:\/\/[^\s\/]+$/.test(v))return MS('Манзил https:// билан бошланиши керак');try{localStorage.setItem('pagon_fb',v)}catch(e){}MR()}
function FX(){try{localStorage.removeItem('pagon_fb')}catch(e){}MR()}
function FC(){const u=location.href.split('#')[0]+'#fb='+encodeURIComponent(FBG());(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>MS('Ҳавола нусхаланди — дўстларга юборинг'),()=>MS(u))}
function MR(){const m=MP,r=m&&(m.host?m:m.r),sd=r&&r.seats||[],nm=r&&r.names||[];
 $('mb').innerHTML='<div class="ph"><b>🌐 Онлайн ўйин</b><button onclick="MW(0)">✕</button></div>'+(m?
  '<div class="pg">Хона коди<div id="rc">'+m.code+'</div></div>'+[0,1,2,3].map(i=>`<div class="rs"><span>${i?'Ўйинчи':'Эга'}: <b>${sd[i]?cl(nm[i])||'—':'🤖 Бот'}</b></span>${m.host&&i&&sd[i]&&HS[i]?`<button onclick="MB(${i})">🤖</button>`:''}</div>`).join('')+
  (m.host?(m.go?'':'<button onclick="MG()">Бошлаш</button><div class="pg">Бўш жойларга ботлар ўтиради</div>'):'<div class="pg">'+(m.k<0?'Кутинг…':'Хона эгаси бошлашини кутинг…')+'</div>')+'<button onclick="ML()">Хонадан чиқиш</button>'
  :'<button onclick="MC()">Хона очиш</button><label class="pg">Ёки хона кодини киритинг<input id="ci" maxlength="4" autocapitalize="characters"></label><button onclick="MJ()">Кириш</button>')+(m?'':FUI())+'<div id="mm" class="pg" style="display:none"></div>'}
// хона очиш (хона эгаси = 0-жой, ўйинни шу қурилма юритади)
async function MC(){const c=await MI();if(typeof c=='string')return MS(c);const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=Array.from({length:4},()=>A[Math.random()*A.length|0]).join(''),d=c.db.doc('rooms/'+code+'/m'),nm=cl(PF.nm);
 try{if((await d.get()).exists)return MC();await d.set({host:c.id,seats:[c.id,'','',''],names:[nm,'','',''],go:0,st:'',v:0,wn:E4()})}catch(e){return MS('Хона очилмади: база манзили ёки қоидаларни текширинг')}
 MP={id:c.id,code,d,host:1,k:0,v:0,go:0,seats:[c.id,'','',''],names:[nm,'','',''],ln:{}};
 MP.u1=c.db.collection('rooms/'+code+'/pl').onSnapshot(HP,()=>MS('Уланиш узилди'));MR()}
// хона эгаси: кирганларни жойларга қўяди ва уларнинг ҳаракатларини бажаради
function HP(q){const m=MP;if(!m||!m.host)return;let ch=0;const ai=[];
 q.docs.forEach(x=>{const p=x.data(),u=x.id;if(!p)return;let k=m.seats.indexOf(u);
  if(k<0&&!m.go){k=m.seats.indexOf('');if(k<0)return;m.seats[k]=u;m.names[k]=cl(p.name)||'Ўйинчи';ch=1}
  if(k>0&&p.n>(m.ln[u]||0)){m.ln[u]=p.n;if(m.go)ai.push([k,p])}});
 if(ch)m.d.update({seats:m.seats,names:m.names}).catch(()=>{});
 if(ai.length){ai.forEach(a=>AI(a[0],a[1]));R();go(dl())}MR()}
function AI(q,p){if(p.a=='L'){HS[q]=0;return}if(!HS[q])return;if(p.a=='N'){if(S.over)nextG();return}
 const h0=HU,t0=TST,a0=AP;S=RT(S,q);M=RM(M,q);HU=0;TST=1;AP=0;
 try{if(p.a=='H'){const i=S.hands[0].findIndex(c=>ck(c)==p.k);if(i>=0)H(i)}else if(p.a=='B')Bt(p.b);else if(p.a=='S')Sl(p.i)}catch(e){}
 WN[q]=S.wn||'';S.wn='';S=RT(S,(4-q)%4);M=RM(M,(4-q)%4);HU=h0;TST=t0;AP=a0}
function MG(){const m=MP;if(!m||!m.host||m.go)return;m.go=1;HS=[0,1,2,3].map(i=>m.seats[i]?1:0);NM=m.names.slice();NM[0]='';M={pg:[6,6]};newGame(-1);MW(0);R();go(600)}
function MB(i){HS[i]=0;MR();R();go(300)}
// хона эгаси ҳолатни ҳаммага юборади
function PUSH(){if(!MP||!MP.host||!MP.go||TST)return;clearTimeout(PT);PT=setTimeout(async()=>{const m=MP;if(!m)return;if(m.bz)return PUSH();const j=JSON.stringify({S:{...S,wn:''},M}),w=WN.join('|');if(j==m.last&&w==m.lw)return;m.bz=1;m.last=j;m.lw=w;try{await m.d.update({go:1,st:j,wn:WN.slice(),v:++m.v})}catch(e){}m.bz=0},150)}
// кириш
async function MJ(){const code=($('ci').value||'').trim().toUpperCase();if(code.length<4)return MS('4 белгили кодни киритинг');const c=await MI();if(typeof c=='string')return MS(c);
 const d=c.db.doc('rooms/'+code+'/m');let s;try{s=await d.get()}catch(e){return MS('Базага уланиб бўлмади')}if(!s.exists)return MS('Хона топилмади');if(s.data().go!=0)return MS('Ўйин аллақачон бошланган');
 const pd=c.db.doc('rooms/'+code+'/pl/'+c.id);try{await pd.set({name:cl(PF.nm),t:Date.now(),n:0,a:'',k:'',i:-1,b:''})}catch(e){return MS('Қўшилиб бўлмади')}
 MP={id:c.id,code,d,pd,host:0,k:-1,n:0};CL=1;document.body.classList.add('cl');MP.u1=d.onSnapshot(CS,()=>MS('Уланиш узилди'));MR()}
function CS(s){const m=MP,r=s.data();if(!m)return;if(!r||r.go==2)return ML(1);m.r=r;m.k=r.seats.indexOf(m.id);
 if(r.go==1&&r.st&&m.k>=0){const k=m.k,o=JSON.parse(r.st);S=RT(o.S,k);M=RM(o.M,k);HU=0;NM=[0,1,2,3].map(i=>i?r.names[(i+k)%4]||'':'');S.wn=(r.wn&&r.wn[k])||'';if(!m.go){m.go=1;MW(0)}R()}else MR()}
function CI(a,o){const m=MP;if(!m||!m.pd||m.k<0)return;m.n++;const d=Object.assign({n:m.n,a,k:'',i:-1,b:''},o);m.q=(m.q||Promise.resolve()).then(()=>m.pd.update(d)).catch(()=>{})}

 const was=CL;MP=null;CL=0;HS=[1,0,0,0];NM=E4();WN=E4();document.body.classList.remove('cl');if(was){M={pg:[6,6]};newGame(-1)}R();go(600);MR();if(c)MS('Хона ёпилди')}

RS()||newGame(-1);R();go(600);
